{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">{{ title }}</h6>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('procurement.add_product') }}">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="name">Product Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="category">Category</label>
                            <input type="text" class="form-control" id="category" name="category" placeholder="e.g., Medication, Lab Reagent" required>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                </div>
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="unit_of_measure">Unit of Measure</label>
                            <input type="text" class="form-control" id="unit_of_measure" name="unit_of_measure" placeholder="e.g., Box, Each, Bottle" required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="sku">SKU (Stock Keeping Unit)</label>
                            <input type="text" class="form-control" id="sku" name="sku">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="reorder_level">Reorder Level</label>
                            <input type="number" class="form-control" id="reorder_level" name="reorder_level" value="0" min="0">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="preferred_supplier_id">Preferred Supplier</label>
                    <select class="form-control" id="preferred_supplier_id" name="preferred_supplier_id">
                        <option value="">None</option>
                        {% for supplier in suppliers %}
                        <option value="{{ supplier.id }}">{{ supplier.company_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-primary mt-3">Add Product</button>
                <a href="{{ url_for('procurement.list_products') }}" class="btn btn-secondary mt-3">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
