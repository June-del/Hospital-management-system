{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">{{ title }}</h6>
        </div>
        <div class="card-body">
            <div class="alert alert-info" role="alert">
                <h4 class="alert-heading">Feature Under Development!</h4>
                <p>This report is currently under development and will be available soon.</p>
                <hr>
                <p class="mb-0">Thank you for your patience.</p>
            </div>
            <a href="{{ url_for('reporting.dashboard') }}" class="btn btn-primary mt-3">Back to Reporting Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
