{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-lg-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">{{ title }}</h2>
                        <p class="text-muted mb-0">Capture the doctor’s professional and personal details.</p>
                    </div>
                    <a class="btn btn-outline-secondary" href="{{ url_for('doctors.doctors_index') }}">Back</a>
                </div>

                <form method="post" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">First Name</label><input type="text" class="form-control" name="first_name" value="{{ doctor.first_name if doctor else '' }}" required></div>
                        <div class="col-md-6"><label class="form-label">Last Name</label><input type="text" class="form-control" name="last_name" value="{{ doctor.last_name if doctor else '' }}" required></div>
                        <div class="col-md-3"><label class="form-label">Gender</label><select class="form-select" name="gender" required><option value="">Select</option><option value="Male" {% if doctor and doctor.gender=='Male' %}selected{% endif %}>Male</option><option value="Female" {% if doctor and doctor.gender=='Female' %}selected{% endif %}>Female</option><option value="Other" {% if doctor and doctor.gender=='Other' %}selected{% endif %}>Other</option></select></div>
                        <div class="col-md-3"><label class="form-label">Date of Birth</label><input type="date" class="form-control" name="date_of_birth" value="{{ doctor.date_of_birth.strftime('%Y-%m-%d') if doctor else '' }}" required></div>
                        <div class="col-md-3"><label class="form-label">National ID / Passport</label><input type="text" class="form-control" name="national_id" value="{{ doctor.national_id if doctor else '' }}" required></div>
                        <div class="col-md-3"><label class="form-label">Phone Number</label><input type="text" class="form-control" name="phone" value="{{ doctor.phone if doctor else '' }}" required></div>
                        <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" name="email" value="{{ doctor.email if doctor else '' }}" required></div>
                        <div class="col-md-6"><label class="form-label">Address</label><input type="text" class="form-control" name="address" value="{{ doctor.address if doctor else '' }}" required></div>
                        <div class="col-md-6"><label class="form-label">Specialization</label><input type="text" class="form-control" name="specialization" value="{{ doctor.specialization if doctor else '' }}" required></div>
                        <div class="col-md-6"><label class="form-label">Department</label><input type="text" class="form-control" name="department" value="{{ doctor.department if doctor else '' }}" required></div>
                        <div class="col-md-6"><label class="form-label">Qualification</label><input type="text" class="form-control" name="qualification" value="{{ doctor.qualification if doctor else '' }}" required></div>
                        <div class="col-md-6"><label class="form-label">Years of Experience</label><input type="number" class="form-control" name="years_of_experience" value="{{ doctor.years_of_experience if doctor else '' }}" required></div>
                        <div class="col-md-6"><label class="form-label">License Number</label><input type="text" class="form-control" name="license_number" value="{{ doctor.license_number if doctor else '' }}" required></div>
                        <div class="col-md-6"><label class="form-label">Consultation Fee</label><input type="number" step="0.01" class="form-control" name="consultation_fee" value="{{ doctor.consultation_fee if doctor else '' }}" required></div>
                        <div class="col-md-6"><label class="form-label">Working Days</label><input type="text" class="form-control" name="working_days" value="{{ doctor.working_days if doctor else '' }}" required></div>
                        <div class="col-md-6"><label class="form-label">Working Hours</label><input type="text" class="form-control" name="working_hours" value="{{ doctor.working_hours if doctor else '' }}" required></div>
                        <div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="status"><option value="Available" {% if doctor and doctor.status=='Available' %}selected{% endif %}>Available</option><option value="On Leave" {% if doctor and doctor.status=='On Leave' %}selected{% endif %}>On Leave</option><option value="Off Duty" {% if doctor and doctor.status=='Off Duty' %}selected{% endif %}>Off Duty</option></select></div>
                        <div class="col-md-12"><label class="form-label">Profile Photo</label><input type="file" class="form-control" name="photo"></div>
                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Doctor</button>
                        <a href="{{ url_for('doctors.doctors_index') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
