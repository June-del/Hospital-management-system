{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-body p-4 p-lg-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-primary">Sign in</h2>
                    <p class="text-muted">Access your hospital workspace securely</p>
                </div>

                <form method="post" class="needs-validation" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Enter your username" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100">Sign In</button>
                </form>

                <div class="mt-4 text-center small text-muted">
                    Default administrator account: <strong>admin / admin123</strong>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
