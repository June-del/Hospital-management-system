{% extends "base.html" %}

{% block content %}
<div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">
        <h2 class="fw-bold mb-3">Invoice PDF Preview</h2>
        <p><strong>Invoice #:</strong> {{ invoice.id }}</p>
        <p><strong>Patient:</strong> {{ invoice.patient.full_name }}</p>
        <p><strong>Amount Due:</strong> {{ invoice.final_amount }}</p>
        <p class="text-muted">PDF export placeholder for future implementation.</p>
    </div>
</div>
{% endblock %}
