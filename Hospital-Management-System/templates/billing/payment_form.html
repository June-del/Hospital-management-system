{% extends "base.html" %}

{% block content %}
<div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Record Payment</h2>
                <p class="text-muted mb-0">Apply a payment toward invoice #{{ invoice.id }}</p>
            </div>
            <a href="{{ url_for('billing.view_invoice', invoice_id=invoice.id) }}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>Back</a>
        </div>

        <form method="post" class="row g-3">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="col-md-6">
                <label class="form-label">Amount Paid</label>
                <input type="number" class="form-control" name="amount_paid" step="0.01" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Payment Method</label>
                <select class="form-select" name="payment_method">
                    <option value="Cash">Cash</option>
                    <option value="Card">Card</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                    <option value="M-Pesa">M-Pesa</option>
                    <option value="Insurance">Insurance</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Reference Number</label>
                <input type="text" class="form-control" name="reference_number">
            </div>
            <div class="col-md-6">
                <label class="form-label">Payment Date</label>
                <input type="date" class="form-control" name="payment_date" value="{{ today }}">
            </div>
            <div class="col-12">
                <label class="form-label">Notes</label>
                <textarea class="form-control" name="notes" rows="3"></textarea>
            </div>
            <div class="col-12">
                <button class="btn btn-success" type="submit"><i class="fas fa-save me-1"></i>Save Payment</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
